[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-news-briefing"
version = "0.1.0"
description = "个性化每日新闻简报：多源抓取 + AI 摘要/翻译/去重 + HTML/PDF + QQ 邮件推送"
requires-python = ">=3.12"
# 依赖统一由 requirements.txt 管理，避免两处漂移；
# 因此安装本项目用 `pip install -e . --no-deps`（CI 与 README 同款）。
dependencies = []

[tool.setuptools]
# 扁平布局：包就在仓库根目录下（不是 src layout）
packages = ["news_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 刻意不设置 --basetemp / cache_dir，使用 pytest 默认值：
#   * 临时目录（tmp_path 的父目录）用系统 %TEMP%\pytest-of-<user>，永远存在；
#   * 缓存用仓库根目录的 .pytest_cache（pytest 自己创建，已在 .gitignore 中）。
# 之前写成 repo 内的 tmp/pytest-work 会出问题：tmp/ 被 .gitignore 忽略，
# CI 全新 checkout 时不存在，而 pytest 只创建 basetemp 的最后一级目录，
# 于是抛 FileNotFoundError: [WinError 3] ...\tmp\pytest-work（23 个 tmp_path 测试全错）。

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["output", "logs", "tmp", ".venv", ".runtime", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

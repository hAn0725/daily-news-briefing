[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=tmp/pytest-work"
cache_dir = "tmp/pytest-cache-work"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["output", "logs", ".venv", ".runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

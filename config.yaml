# ============================================================
# 每日新闻简报 · 配置文件
# 修改后保存，下次运行自动生效。所有新闻源可自由增删。
# ============================================================

report:
  hours_back: 26          # 只保留最近 26 小时内的新闻（热榜不受此限制）
  output_dir: "output"    # 报告输出目录（按月归档）
  logs_dir: "logs"
  keep_days: 30           # 自动清理 N 天前的旧报告
  fulltext_cap: 80        # 增加重点源正文覆盖，供 AI 提炼背景与影响
  max_items_per_source: 50 # 单个源进入后续处理的最大条数，控制失效 RSS 和 AI 成本
  max_items_per_source_in_category: 3 # 每类优先最多采用同一来源 3 条，不足时自动回填
  post_dedup_threshold: 0.5   # 本地模式/兜底时的摘要相似度去重阈值（AI 模式下用语义去重更准）
  pdf:
    enabled: true
    keep_html: true       # 邮件同时附加 HTML 和 PDF，必须保留 HTML
  categories:
    finance:
      title: "财经与股市"
      max_items: 12       # 该分类最多保留条数
    tech:
      title: "科技前沿"
      max_items: 10
    science:
      title: "科学与研究"
      max_items: 6
    world:
      title: "国际大事"
      max_items: 8
    other:
      title: "综合观察"
      max_items: 4

# ---------- AI 设置（DeepSeek）----------
ai:
  enabled: true                      # false 则完全走本地处理
  required: true                     # DeepSeek 失败时不允许混入本地摘要后继续发送
  provider: "deepseek"
  api_key_env: "DEEPSEEK_API_KEY"   # 本机已有 DPAPI 加密密钥
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"
  batch_size: 25                     # 较小批次为详细摘要留出稳定输出空间
  thinking: "disabled"               # 新闻整理无需深度思考，减少延迟
  concurrency: 4                     # DeepSeek 支持并行批处理
  timeout: 180
  max_tokens: 8192
  feed_summary_chars: 900            # 输入更多 RSS 摘要上下文
  full_text_chars: 1600              # 输入更多正文，增强背景、数据和影响分析
  dedup_max_group_size: 4            # 单个具体事件最多合并 4 家不同来源
  dedup_max_drop_ratio: 0.30         # AI 拟删除超过 30% 时整次去重作废
  max_retries: 3
  retry_base_seconds: 2
  min_request_interval_seconds: 0
  pricing:
    input_per_million: 3.2
    output_per_million: 9.5

# ---------- 网络设置 ----------
network:
  request_timeout: 15
  retries: 2
  # 代理地址（梯子）。国外源（英文源）会自动走此代理，国内源直连。
  # 留空 = 直连（此时国外源可能无法访问）。
  proxy: "http://127.0.0.1:7892"
  # VPN 预检：配置了 proxy 时只走该代理，绝不回退到国内可直连站点。
  check_timeout: 12
  # 探针列表：任一成功即视为联网（代码按顺序逐个尝试）。
  # 2026-09-10 事故：VPN 节点对 Google 系域名随机超时（同一域名时通时断），
  # 单一探针导致整天被误判"未联网"而不生成，故加备用探针兜底；
  # 即使个别探针被规则分流直连而误放行，后面还有 require_foreign_news
  # 第二道闸（海外源数量/条数不达标照样不发）。
  check_urls:
    - "https://www.google.com/generate_204"
    - "https://www.gstatic.com/generate_204"
    - "https://cp.cloudflare.com/generate_204"
  check_statuses: [204]
  # 抓取后的第二道闸门；不达标时不生成、不发邮件，定时入口 5 分钟后重试。
  require_foreign_news: true
  min_foreign_sources: 3
  min_foreign_items: 5

# ---------- 定时与联网检测（计划任务 run_daily.bat / --wait-net 使用）----------
schedule:
  timezone: "Asia/Shanghai"
  retry_interval_minutes: 5   # 未联网/VPN未开时，每隔多少分钟重试一次
  deadline: "23:00"           # 当天到此时间仍未联网则放弃，次日 07:00 计划任务再试
  # 不再按峰谷价格延后日报，联网后立即生成。
  peak_periods: []

# ---------- 邮件发送（QQ 邮箱）----------
# 授权码不写在这里！先在 QQ 邮箱网页版开启 SMTP 服务拿到授权码，
# 再运行 tools/store_smtp.py 录入（加密存入 .env，不落明文）。
email:
  enabled: true
  smtp_host: "smtp.qq.com"
  smtp_port: 465              # QQ 邮箱 SSL 端口
  # 发件/收件邮箱不写在本文件（避免公开仓库泄露），请在 .env 中设置：
  #   SMTP_FROM_ADDR=你的QQ邮箱        （发件邮箱，须与授权码所属账号一致）
  #   SMTP_TO_ADDRS=收件邮箱            （多个用英文逗号分隔；留空则发给自己）
  subject_prefix: "【每日新闻简报】"
  # 邮件同时发送 PDF 和 HTML 附件；HTML 保留最佳样式与可点击链接

# ---------- 用户画像（AI 据此筛选与加权，可随时调整）----------
user_profile:
  background: "光电信息科学与工程专业本科生，正在探索专业方向；同时是刚入门的股民/投资者。"
  focus_areas:
    - "半导体/芯片"
    - "新能源/锂电"
    - "AI/算力"
    - "军工/高端制造"
    - "光电/显示/光学"
  priorities:
    - "A股/港股行情"
    - "美股与全球市场"
    - "宏观政策与经济数据"
    - "科技前沿（半导体、AI、光电）"
    - "国际地缘大事"
  # 本地过滤也会使用这些词（AI 二次剔除更全面）
  exclude_keywords:
    - "八卦"
    - "绯闻"
    - "恋情"
    - "出轨"
    - "塌房"
    - "灵异"
    - "奇闻"
    - "猎奇"
    - "秒杀"
    - "促销"
    - "优惠券"
    - "抽奖"
    - "爆款"
    - "种草"
    - "安利"
    - "明星同款"
  summary_style: "客观简报"
  summary_length: 200        # 今日要闻综述的目标字数
  item_summary_chars: 260    # 覆盖事实、数据、背景、影响与不确定性
  language_level: "通俗易懂，面向非专业人士"

